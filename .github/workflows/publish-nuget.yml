name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore PocketBase.SDK.slnx

      - name: Build
        run: dotnet build PocketBase.SDK.slnx -c Release --no-restore

      - name: Test (net10)
        run: dotnet test PocketBase.SDK.Tests/PocketBase.SDK.Tests.csproj -c Release -f net10.0 --no-build

      - name: Pack
        run: dotnet pack PocketBase.SDK.slnx -c Release --no-build

      - name: Push PocketBase.SDK.Abstractions
        run: dotnet nuget push PocketBase.SDK.Abstractions/bin/Release/PocketBase.SDK.Abstractions.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push PocketBase.SDK
        run: dotnet nuget push PocketBase.SDK/bin/Release/PocketBase.SDK.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push PocketBase.SDK.DependencyInjection
        run: dotnet nuget push PocketBase.SDK.DependencyInjection/bin/Release/PocketBase.SDK.DependencyInjection.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
